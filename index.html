<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- SECTION SELECTION VIEW -->
        <div id="section-select-view" class="view">
            <header style="padding-bottom: 2rem;">
                <h1>Attendance</h1>
                <p>Select your section</p>
            </header>
            <div class="section-cards">
                <div class="section-card" data-section="cse2">
                    <h2>CSE II</h2>
                    <p>69 Students</p>
                </div>
                <div class="section-card" data-section="cse3">
                    <h2>CSE III</h2>
                    <p>71 Students</p>
                </div>
                <div class="section-card" data-section="cse4">
                    <h2>CSE IV</h2>
                    <p>69 Students</p>
                </div>
            </div>
        </div>

        <!-- ATTENDANCE VIEW -->
        <div id="attendance-view" class="view hidden">
            <header class="attendance-header">
                <button id="back-btn" class="btn tertiary-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div>
                    <h1 id="current-section-title">Section</h1>
                    <p>Select students who are <span class="highlight">absent</span></p>
                </div>
            </header>

            <div class="list-header">
                <div class="count-display">
                    <span>Absent:</span> 
                    <span class="highlight-count" id="absent-count">0</span>
                    <span style="font-size:0.8rem; opacity:0.6; margin-left:4px;">/ <span id="total-count">69</span></span>
                </div>
                <button id="generate-btn" class="btn primary-btn" style="padding: 0.5rem 1rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <span class="desktop-only">Generate</span>
                </button>
            </div>
            
            <main id="student-list" class="student-list">
                <!-- Students will be dynamically injected here -->
            </main>
        </div>
    </div>

    <!-- Modal for Result -->
    <div id="report-modal" class="modal hidden">
        <div class="modal-content">
            <div class="mobile-drag-handle"></div>
            <h2>Attendance Report</h2>
            <textarea id="report-output" readonly></textarea>
            <div class="modal-actions">
                <button id="close-btn" class="btn tertiary-btn">Close</button>
                <button id="copy-btn" class="btn secondary-btn">Copy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
